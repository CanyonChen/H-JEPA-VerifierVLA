[project]
name = "h-jepa-libero-client"
version = "0.1.0"
description = "LIBERO simulation and WebSocket client; GPU policy inference runs in the root environment"
requires-python = ">=3.8,<3.9"
dependencies = [
    "libero",
    "openpi-client",
    "torch==1.11.0+cpu",
    "numpy==1.22.4",
    "robosuite==1.4.1",
    "mujoco==3.2.3",
    "numba==0.53.1",
    "llvmlite==0.36.0",
    "scipy==1.10.1",
    "matplotlib==3.5.3",
    "opencv-python==4.6.0.66",
    "pillow==10.4.0",
    "imageio[ffmpeg]==2.35.1",
    "imageio-ffmpeg==0.5.1",
    "gym==0.25.2",
    "bddl==1.0.1",
    "easydict==1.9",
    "cloudpickle==2.1.0",
    "pyyaml==6.0.2",
    "tqdm==4.67.1",
    "tyro==0.9.2",
    "websockets==13.1",
    "typing-extensions==4.12.2",
    "pyopengl==3.1.7",
    "glfw==1.12.0",
    "pynput==1.7.7",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
build-constraint-dependencies = ["setuptools==75.3.0", "hatchling==1.27.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
libero = { path = "../../openpi/third_party/libero", editable = true }
openpi-client = { path = "../../openpi/packages/openpi-client", editable = true }
