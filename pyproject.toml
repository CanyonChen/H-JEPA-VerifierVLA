[project]
name = "h-jepa-verifiervla"
version = "0.1.0"
description = "Shared model environment for openpi, H-JEPA and VeriVLA"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openpi",
    "openpi-client",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy==1.26.4",
    "einops==0.8.1",
    "transformers==4.53.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

# Package the model modules, without installing H-JEPA's benchmark environment.
[tool.hatch.build.targets.wheel]
packages = ["H-JEPA/repository-main/h_jepa", "VeriVLA/repository/verifier"]

[tool.hatch.build.targets.wheel.force-include]
"H-JEPA/repository-main/LICENSE" = "h_jepa/LICENSE"
"VeriVLA/repository/LICENSE" = "verifier/LICENSE"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Preserve the compatibility overrides required by the pinned openpi release.
override-dependencies = ["ml-dtypes==0.4.1", "tensorstore==0.1.74"]

[tool.uv.sources]
openpi = { path = "openpi", editable = true }
openpi-client = { path = "openpi/packages/openpi-client", editable = true }
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }
